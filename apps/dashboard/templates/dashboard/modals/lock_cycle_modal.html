<!-- Modal 1: Kunci Siklus (Lock Snapshot) -->
<div id="modalLockCycle" class="modal-backdrop">
  <div class="modal-card max-w-[480px]">
    <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
      <h3 class="text-base font-bold text-[#0B192C] flex items-center gap-2">
        <span class="material-symbols-outlined text-orange-600 text-[22px]">lock</span>
        Kunci Siklus Snapshot Resmi
      </h3>
      <button onclick="closeLockModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
    </div>

    <form method="POST" action="{% url 'lock_cycle' %}">
      {% csrf_token %}
      <div class="p-3.5 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-900 mb-4 flex items-start gap-2.5">
        <span class="material-symbols-outlined text-[20px] text-amber-700 mt-0.5">warning</span>
        <div class="leading-relaxed">
          <strong>Perhatian Dinas:</strong> Mengunci lembar siklus <strong>{{ current_cycle.kode_siklus }}</strong> akan mengubah status seluruh data menjadi <em>Read-Only</em> sebelum diserahkan ke Kepala BNPB.
        </div>
      </div>

      <div class="mb-3.5">
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Nama Pejabat / Kasubdit Pengesah:</label>
        <input type="text" name="supervisor_name" class="filter-input w-full font-semibold" value="Drs. H. Sutaryo, M.Si (Kasubdit Pengendalian Operasi)" required>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Catatan Pengesahan Siklus:</label>
        <textarea name="catatan" class="filter-input w-full h-[75px]" placeholder="Pengesahan resmi laporan situasi harian untuk penyerahan ke Kepala BNPB..."></textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-200">
        <button type="button" onclick="closeLockModal()" class="btn btn-secondary">Batal</button>
        <button type="submit" class="btn bg-[#0B192C] hover:bg-black text-white font-bold">
          <span class="material-symbols-outlined text-[16px]">lock</span>
          <span>Konfirmasi Kunci Naskah</span>
        </button>
      </div>
    </form>
  </div>
</div>
